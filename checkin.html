<style>
:root{--bg:#F3F5F6;--surface:#fff;--ink:#101820;--muted:#566f7e;--line:#c9d9df;--navy:#FFFFFF;--on-navy:#0C0D0E;--accent:#2E799E;--bad:#b32d2d;--good:#1f7a3d}
@media (prefers-color-scheme:dark){:root{--bg:#08171f;--surface:#0f2431;--ink:#e5f0f4;--muted:#8da7b5;--line:#1d3a4b;--accent:#5BBDEB}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
header{background:var(--navy);color:var(--on-navy);padding:18px 16px;text-align:center}
header img{height:56px;width:auto}
header p{margin:6px 0 0;opacity:.8;font-size:.95rem}
main{max-width:620px;margin:0 auto;padding:16px}
fieldset{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin:0 0 14px;padding:14px 14px 6px}
legend{font-weight:700;padding:0 6px}
label.f{display:grid;gap:4px;margin-bottom:12px;font-weight:600;font-size:.95rem}
input,select{font:inherit;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.chk{display:flex;gap:10px;align-items:flex-start;margin:0 0 10px;font-weight:400}
.chk input{width:20px;height:20px;margin-top:2px;flex:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.two{grid-template-columns:1fr}}
button{font:inherit;font-weight:700;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:14px;width:100%;cursor:pointer}
button:disabled{opacity:.6}
.hint{color:var(--muted);font-size:.85rem;font-weight:400}
#err{color:var(--bad);min-height:1.3em;margin:8px 0}
.done{text-align:center;padding:40px 16px}
.done h1{color:var(--good)}
</style></head><body>

<label class="f">Do you live in Indonesia? *<select name="local" required><option value="">—</option><option>Yes</option><option>No</option></select></label>
</fieldset>
<fieldset><legend>What would you like to do with us?</legend>
<div id="ints"></div>
<div class="two"><label class="f">Planned date (if you know)<input name="planned" type="date"></label>
<label class="f">Preferred start time<select name="time"><option value="">—</option><option>9:00 (morning)</option><option>11:00 (late morning)</option><option>Afternoon</option></select></label></div>
</fieldset>
<fieldset><legend>Diving</legend>
<label class="f">Certification level *<select name="level" required><option value="">—</option><option>None (beginner)</option><option>Scuba Diver</option><option>Open Water Diver</option><option>Advanced Adventurer</option><option>Advanced Open Water</option><option>Stress &amp; Rescue</option><option>Dive Guide / Divemaster</option><option>Assistant Instructor</option><option>Instructor</option><option>Other</option></select></label>
<label class="f">Certification number<input name="certNo"></label>
</fieldset>
<fieldset><legend>Emergency contact</legend>
<label class="f">Name *<input name="emName" required></label>
<label class="f">Phone *<input name="emPhone" type="tel" required></label>
</fieldset>
<fieldset><legend>Equipment sizes</legend>
<p class="hint">If you are not sure, choose your usual size. We will check with you at the dive shop.</p>
<div class="two"><label class="f">BCD size<select name="bcd"><option value="">—</option><option>XXS</option><option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option></select></label>
<label class="f">Wetsuit size<select name="wetsuit"><option value="">—</option><option>XXS</option><option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option><option>XXXL</option></select></label></div>
<label class="f">Fins size (EU shoe size)<input name="fins" inputmode="decimal"></label>
</fieldset>
<fieldset><legend>Last step</legend>
<label class="f">How did you hear about us? (hotel, agent, friend, online…)<input name="heard"></label>
<label class="chk"><input type="checkbox" name="consent" required><span>I agree that this dive centre stores these details to organise my dive. *</span></label>
</fieldset>
<div id="err" role="alert"></div>
<button type="submit" id="go">Send my check-in</button>
</form>
</main>
<script>
const INTS=['Fun dive(s)','Discovery Scuba Dive (try dive)','Scuba Diver course','Open Water course','Advanced course','Refresher (Scuba Tune Up)','Specialty course (Nitrox, Deep, Wreck...)','Rescue / EFR course','Divemaster / pro course','Not sure yet, I need advice'];
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CID=new URLSearchParams(location.search).get('c')||'';
(async function brand(){
  try{const c=window.DD_CONFIG;if(!c||/__SUPABASE/.test(c.url+c.key))return;
    const r=await fetch(c.url.replace(/\/+$/,'')+'/rest/v1/public_info?id=eq.'+encodeURIComponent(CID)+'&select=data',{headers:{apikey:c.key,Authorization:'Bearer '+c.key}});
    const j=await r.json();const b=j&&j[0]&&j[0].data;if(!b)return;
    if(/^#[0-9a-f]{6}$/i.test(b.navy||'')){const h=b.navy,l=(0.2126*parseInt(h.slice(1,3),16)+0.7152*parseInt(h.slice(3,5),16)+0.0722*parseInt(h.slice(5,7),16))/255;document.documentElement.style.setProperty('--navy',h);document.documentElement.style.setProperty('--on-navy',l>0.6?'#10202b':'#f4fafb')}
    if(/^#[0-9a-f]{6}$/i.test(b.accent||''))document.documentElement.style.setProperty('--accent',b.accent);
    if(b.logo&&/^data:image\//.test(b.logo))document.getElementById('lg').src=b.logo;
    if(b.name){document.title=b.name+' · Check-in';document.getElementById('lg').alt=b.name}
  }catch(e){}
})();
document.getElementById('ints').innerHTML=INTS.map(t=>'<label class="chk"><input type="checkbox" class="int" value="'+esc(t)+'"><span>'+esc(t)+'</span></label>').join('');
const f=document.getElementById('f'),err=document.getElementById('err'),go=document.getElementById('go');
f.addEventListener('submit',async e=>{
  e.preventDefault();err.textContent='';
  const fd=new FormData(f),d={};
  ['first','last','email','phone','nat','lang','local','planned','time','level','certNo','emName','emPhone','bcd','wetsuit','fins','heard'].forEach(k=>d[k]=String(fd.get(k)||'').trim());
  d.interest=[...f.querySelectorAll('.int:checked')].map(x=>x.value).join(', ');
  const miss=['first','last','email','phone','nat','local','level','emName','emPhone'].filter(k=>!d[k]);
  if(miss.length||!f.consent.checked){err.textContent='Please fill in all fields marked * and accept the consent box.';return}
  if(!/^\S+@\S+\.\S+$/.test(d.email)){err.textContent='Please enter a valid email address.';return}
  go.disabled=true;go.textContent='Sending…';
  try{
    const c=window.DD_CONFIG;
    if(!/^[0-9a-f-]{36}$/i.test(CID))throw new Error('no centre');
    const r=await fetch(c.url.replace(/\/+$/,'')+'/rest/v1/checkins',{method:'POST',headers:{apikey:c.key,Authorization:'Bearer '+c.key,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({centre_id:CID,data:d})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    document.getElementById('m').innerHTML='<div class="done"><h1>You\'re all set!</h1><p>Thank you, '+esc(d.first)+'. See you at the dive shop.</p></div>';
    window.scrollTo(0,0);
  }catch(x){err.textContent='Sorry, it could not be sent. Please check your connection and try again.';go.disabled=false;go.textContent='Send my check-in'}
});
</script></body></html>
